name: Audit official FAFB connections (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-connectivity-audit:
    name: One-time verified Zenodo connectivity sample audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional Feather reader
        run: python -m pip install 'pyarrow>=16,<24'
      - name: Download official FAFB v783 archives
        run: |
          curl --fail --location --retry 2 --max-time 900 \
            "https://zenodo.org/records/10676866/files/proofread_connections_783.feather?download=1" \
            --output /tmp/proofread_connections_783.feather
          curl --fail --location --retry 2 --max-time 120 \
            "https://zenodo.org/records/10676866/files/proofread_root_ids_783.npy?download=1" \
            --output /tmp/proofread_root_ids_783.npy
      - name: Verify official files, extract sample, and import graph
        env:
          PYTHONPATH: backend
        run: |
          python -m app.data.official_root_ids /tmp/proofread_root_ids_783.npy
          python -m app.data.feather_sample \
            --source /tmp/proofread_connections_783.feather \
            --out /tmp/official_connectivity_sample.csv \
            --rows 20000 --proofread-ids /tmp/proofread_root_ids_783.npy
          python -m app.data.pipeline \
            --connections /tmp/official_connectivity_sample.csv \
            --out /tmp/official-subgraph.sqlite3 \
            --proofread-ids /tmp/proofread_root_ids_783.npy \
            --max-neurons 60 --max-edges 300 --min-synapses 5
          python -c "from pathlib import Path; from app.data.store import GraphStore; s=GraphStore(Path('/tmp/official-subgraph.sqlite3')); i=s.info(); assert i['nodes_selected'] > 1 and i['edges_selected'] > 0 and i['source_identity_verified'] is False; print('Official archive connection sample imported:', i['nodes_selected'], 'neurons and', i['edges_selected'], 'directed edges')"

name: Neuroverse CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend / lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  backend:
    name: Backend / tests and syntax
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q app tests
      - name: Run tests
        run: python -m pytest -q

  integration:
    name: Full-stack HTTP smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install locked frontend and backend dependencies
        run: |
          cd frontend && npm ci --no-audit --no-fund
          cd ../backend && python -m pip install -r requirements.txt
      - name: Start both servers and verify Vite proxy
        shell: bash
        run: |
          set -euo pipefail
          python -m uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8000 > /tmp/neuroverse-api.log 2>&1 &
          API_PID=$!
          (cd frontend && npm run dev -- --host 127.0.0.1) > /tmp/neuroverse-ui.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$API_PID" "$WEB_PID" 2>/dev/null || true' EXIT

          ready=0
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:8000/api/v1/health >/dev/null &&
               curl -fsS http://127.0.0.1:5173/api/v1/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo 'Servers did not become healthy.'
            cat /tmp/neuroverse-api.log /tmp/neuroverse-ui.log
            exit 1
          fi

          curl -fsS http://127.0.0.1:5173/api/v1/health |
            python -c 'import json,sys; o=json.load(sys.stdin); assert o["status"] == "ok" and o["service"] == "neuroverse-api"'
          curl -fsS http://127.0.0.1:5173/ | grep -qi 'Neuroverse'

  official-ids:
    name: Official FAFB v783 proofread ID archive verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download public 1.1 MB Zenodo root ID archive
        run: |
          curl --fail --location --retry 3 --max-time 120 \
            "https://zenodo.org/records/10676866/files/proofread_root_ids_783.npy?download=1" \
            --output /tmp/proofread_root_ids_783.npy
          test "$(stat -c%s /tmp/proofread_root_ids_783.npy)" -lt 3000000
      - name: Verify publisher checksum and neuron ID count
        run: PYTHONPATH=backend python -m app.data.official_root_ids /tmp/proofread_root_ids_783.npy

  browser:
    name: Chromium / desktop & mobile UX
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify real FAFB mesh and stage it for Chromium screenshots
        shell: bash
        run: |
          curl --fail --location --retry 3 --max-time 90 \
            "https://raw.githubusercontent.com/navis-org/navis-flybrains/273333c8d8bf5adeebebd274e554621462e388bd/flybrains/meshes/FLYWIRE_whole_brain.ply" \
            --output /tmp/neuroverse_verified_fafb.ply
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha1
          blob=Path('/tmp/neuroverse_verified_fafb.ply').read_bytes()
          assert 100000 < len(blob) < 20000000
          digest=sha1(f'blob {len(blob)}\0'.encode()+blob, usedforsecurity=False).hexdigest()
          assert digest=='3cf14cdd1399f212057f40c918493452abf056da', 'Official PLY content mismatch'
          print('Authentic FAFB 3D tissue mesh authenticated:',len(blob),'bytes')
          PY
          echo "NEUROVERSE_REAL_PLY_FILE=/tmp/neuroverse_verified_fafb.ply" >> "$GITHUB_ENV"
      - name: Verify registered FAFB-aligned original neuropil and stage browser fixture
        shell: bash
        run: |
          curl --fail --location --retry 3 --max-time 90 \
            "https://raw.githubusercontent.com/navis-org/navis-flybrains/273333c8d8bf5adeebebd274e554621462e388bd/flybrains/meshes/FLYWIRE.ply" \
            --output /tmp/neuroverse_verified_fafb_neuropil.ply
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha1
          raw=Path('/tmp/neuroverse_verified_fafb_neuropil.ply').read_bytes()
          assert 100000 < len(raw) < 20000000
          assert sha1(f'blob {len(raw)}\\0'.encode()+raw, usedforsecurity=False).hexdigest() == '468c217c41602a8d34df2af6afd00a2aa1c11077'
          print('FAFB-aligned published neuropil source authenticated:',len(raw),'bytes')
          PY
          echo "NEUROVERSE_REAL_NEUROPIL_PLY_FILE=/tmp/neuroverse_verified_fafb_neuropil.ply" >> "$GITHUB_ENV"
      - name: Exercise real-browser homepage, controls and fallbacks
        run: npm run test:e2e
        env:
          CI: true
      - name: Save browser screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neuroverse-phase04-browser-results
          if-no-files-found: ignore
          retention-days: 14
          path: |
            frontend/test-results/
            frontend/playwright-report/

  real-anatomy-source-audit:
    name: Verify original FAFB tissue mesh and neuron skeleton
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read and authenticate original scientific geometry
        run: |
          python - <<'PY'
          from app.data.tissue import load_official_tissue_mesh
          from app.data.morphology import get_skeleton
          mesh, sha = load_official_tissue_mesh()
          from app.data.neuropil import load_official_neuropil_mesh
          neuropil, neuropil_sha = load_official_neuropil_mesh()
          assert neuropil.startswith(b"ply") and len(neuropil_sha) == 64
          print("REAL FAFB NEUROPIL MESH", len(neuropil), "bytes, SHA256", neuropil_sha)
          assert mesh.startswith(b"ply") and len(sha) == 64
          print("REAL TISSUE MESH", len(mesh), "bytes, SHA256", sha)
          neuron = get_skeleton("720575940625431866")
          assert neuron["snapshot"] == "783" and neuron["units"] == "nanometer"
          assert neuron["vertex_count"] > 10 and neuron["edge_count"] > 5
          print("REAL FAFB783 NEURON", neuron["root_id"], "vertices",
                neuron["vertex_count"], "edges", neuron["edge_count"],
                "SHA256", neuron["source_sha256"])
          PY

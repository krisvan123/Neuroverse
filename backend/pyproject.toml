[project]
name = "neuroverse-api"
version = "0.3.0"
description = "Source-grounded educational FastAPI service for Neuroverse."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
